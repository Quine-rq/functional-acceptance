name: Reproducible problem
description: Report a bounded defect, installation issue, or documentation error.
title: "bug: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Use synthetic or redacted information only. Do not post credentials, customer data, private evidence, or vulnerability details here.
  - type: input
    id: version
    attributes:
      label: Installed commit or version
      description: Include the commit pin when known.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Agent and environment
      placeholder: "Agent host/version, OS, and relevant runtime"
    validations:
      required: true
  - type: textarea
    id: request
    attributes:
      label: Request and expected user outcome
    validations:
      required: true
  - type: textarea
    id: observation
    attributes:
      label: Observed outcome and minimal safe reproduction
    validations:
      required: true
