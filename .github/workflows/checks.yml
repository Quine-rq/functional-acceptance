name: Native checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Helper and collector checks
        run: python -B -m unittest discover -s tests -v
      - name: Standalone native regression pack
        run: python -B -m unittest discover -s examples/paginated_export -p 'test_export.py' -v
      - name: SQLite pack process lifecycle (synthetic, no upstream dependencies)
        run: |
          if output=$(python -B -S -m unittest discover -s examples/sqlite_utils/acceptance -p test_lifecycle.py -v 2>&1); then
            printf '%s\n' "$output"
          else
            status=$?
            printf '%s\n' "$output"
            message=${output: -8000}
            message=${message//'%'/'%25'}
            message=${message//$'\r'/'%0D'}
            message=${message//$'\n'/'%0A'}
            printf '::error title=SQLite lifecycle regression failed::%s\n' "$message"
            exit "$status"
          fi
      - name: SQLite pack pre-import identity guard (synthetic, no upstream dependencies)
        run: python -B -S -m unittest discover -s examples/sqlite_utils/acceptance -p test_identity.py -v
      - name: Retained evidence consistency (not live host or browser execution)
        run: python -B evals/results/2026-09-08-product-hardening/check_record.py
      - name: Reuse and recovery retained evidence (not live execution)
        run: python -B evals/results/2026-09-08-reuse/check_record.py
      - name: Native follow-up retained evidence (not live model execution)
        run: python -B evals/results/2026-09-08-native-followup/check_record.py
  installation:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22.22.3'
          package-manager-cache: false
      - name: Install pinned development-only dependencies
        run: npm --prefix integration ci --ignore-scripts --no-audit --no-fund
      - name: Package discovery and isolated install lifecycle
        run: npm --prefix integration test
